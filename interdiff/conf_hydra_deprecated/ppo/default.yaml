# PPO Hyperparameters
_target_: interdiff.ppo.HParams
num_actions: ${tokenizer.vocab_size}
num_envs: 16
num_steps: 256 # bs = num_envs * num_steps / num_minibatches
budget: 10000000
num_epochs: 1
num_minibatches: 8 # or 16
clip_eps: 0.2
ent_coef: 0.01
max_episode_length: ${context.seq_len}
vf_coef: 0.5
max_grad_norm: 1.0
lr: 1e-6
normalise_advantage: true
clip_value_loss: true
gae_lambda: 0.95
discount: 1.0 # or 0.99
weight_decay: 0.01
anneal_lr: true
lambda_kld: 0.05  # KL divergence penalty coefficient (0 = disabled)
log_frequency: 1
log_to_wandb: ${wandb_log}
wandb_project_name: ${experiment.wandb_project}
save_dir: ${rl_train_cfg.ckpt_path}
eval_frequency: 1
random_start: False