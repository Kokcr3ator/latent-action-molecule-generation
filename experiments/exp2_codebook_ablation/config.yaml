# =============================================================================
# Experiment 2 — Codebook size ablation
# Properties listed here override the defaults in configs/*.yaml.
# Everything else is inherited from the base configs unchanged.
# =============================================================================

pretrain_seed: 42
rl_seeds: [42, 43, 44]
tasks: [qed, logp, sa, mw, tpsa]
vocab_sizes: [50, 512, 4096]     # base GPT token vocabulary sizes to sweep
num_latents_list: [25, 128, 256] # ControllableGPT codebook sizes to sweep
ctrl_vocab_size: 500             # ControllableGPT always uses the standard vocab
wandb_group: exp2_codebook_ablation
