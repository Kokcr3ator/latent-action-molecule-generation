# =============================================================================
# Experiment 1 — Main comparison: base GPT vs ControllableGPT
# Properties listed here override the defaults in configs/*.yaml.
# Everything else is inherited from the base configs unchanged.
# =============================================================================

# --- Paths -------------------------------------------------------------------
data_dir: interdiff/data/zinc/zinc.txt   # raw SMILES file
ckpt_root: ckpts                         # root directory for all checkpoints

# --- Model -------------------------------------------------------------------
vocab_size: 2048       # base GPT token vocabulary size
num_latents: 128      # ControllableGPT codebook size

# --- Training ----------------------------------------------------------------
batch_size: 2048
seeds: [0, 1, 2, 3, 4]
tasks: [qed, logp, sa, mw, tpsa]
pretrain_iters: 100000      # max_iters for base GPT pretraining
controllable_iters: 80_000   # max_iters for ControllableGPT pretraining
distillation_iters: 20_000   # max_iters for policy distillation
rl_budget: 250000000        # total env steps for PPO finetuning

# --- Logging -----------------------------------------------------------------
wandb_project: interdiff
wandb_entity: latent-action-interdiff
wandb_group: exp1_main_comparison
