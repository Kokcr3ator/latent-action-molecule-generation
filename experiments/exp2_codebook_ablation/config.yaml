# =============================================================================
# Experiment 2 — Codebook size ablation
#
# Usage:
#   python3 -m scripts.train     --config experiments/exp2_codebook_ablation/config.yaml --stage pretrain_base
#   python3 -m scripts.train     --config experiments/exp2_codebook_ablation/config.yaml --stage pretrain_controllable
#   python3 -m scripts.train     --config experiments/exp2_codebook_ablation/config.yaml --stage policy_distillation
#   python3 -m scripts.train_ppo --config experiments/exp2_codebook_ablation/config.yaml --stage finetune_base
#   python3 -m scripts.train_ppo --config experiments/exp2_codebook_ablation/config.yaml --stage finetune_controllable
#
# Each stage is loaded as OmegaConf.merge(defaults, <stage>), so stages only
# declare what differs from the shared defaults below.
# =============================================================================

# ===== SHARED DEFAULTS ========================================================
defaults:
  seed: 42
  wandb_log: true
  from_scratch: false
  eval_only: false
  compile: true

  context:
    seq_len: 128

  tokenizer:
    dataset_path: ${data.smiles}
    output_dir: interdiff/data/processed/${data.name}_tok_seqlen_${context.seq_len}_vocabsize_${tokenizer.vocab_size}
    use_selfies: false
    vocab_size: 500
    pad_token: "[PAD]"
    unk_token: "[UNK]"
    mask_token: "[MASK]"
    bos_token: "[BOS]"
    eos_token: "[EOS]"
    seq_length: ${context.seq_len}
    pad_token_id: 0
    unk_token_id: 1
    mask_token_id: 2
    bos_token_id: 3
    eos_token_id: 4

  data:
    name: zinc
    smiles: interdiff/data/zinc/zinc.txt
    pad_token_id: ${tokenizer.pad_token_id}

  sys:
    device: cuda
    dtype: float16
    always_save_checkpoint: false
    compile: true

  optimizer:
    _target_: interdiff.optim.adam_w
    learning_rate: 3e-4
    beta1: 0.9
    beta2: 0.99
    weight_decay: 0.0
    device_type: ${sys.device}

  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    eta_min: 1e-5
    T_max: ${training.max_iters}

  log:
    _target_: interdiff.logging.wandb_logger.WandbLogger
    project: interdiff
    entity: latent-action-interdiff
    group: exp2_codebook_ablation

# ===== STAGE: PRETRAIN BASE ===================================================
pretrain_base:
  experiment:
    wandb_project: interdiff
    wandb_entity: latent-action-interdiff
    wandb_run_name: pretrain_base_vocab${tokenizer.vocab_size}_seed${seed}

  model:
    _target_: interdiff.models.GPT
    n_layer: 4
    n_head: 4
    n_embd: 384
    dropout: 0.0
    context_length: ${context.seq_len}
    lm_head_out_size: ${tokenizer.vocab_size}
    vocab_size: ${tokenizer.vocab_size}
    bias: false
    pad_token_id: ${tokenizer.pad_token_id}
    bos_token_id: ${tokenizer.bos_token_id}
    eos_token_id: ${tokenizer.eos_token_id}

  training:
    _target_: interdiff.trainers.TrainConfig
    grad_clip: 1.0
    device: ${sys.device}
    mixed_dtype: ${sys.dtype}
    compile_model: ${sys.compile}
    always_save_checkpoint: ${sys.always_save_checkpoint}
    ckpt_path: ${ckpt.path}
    eval_interval: 1000
    eval_iters: 5
    log_interval: 20
    max_iters: 100000
    warmup_iters: 1000
    batch_size: 512
    gradient_accumulation_steps: 1
    n_mols_generate: 200
    pad_token_id: ${tokenizer.pad_token_id}
    tokenizer_dir: ${tokenizer.output_dir}

  trainer:
    _target_: interdiff.trainers.GPTTrainer

  loader:
    _target_: interdiff.data.GPTLoader.GPTLoader
    pad_token_id: ${tokenizer.pad_token_id}
    batch_size: ${training.batch_size}
    seed: ${seed}
    val_ratio: 0.1

  log:
    name: ${experiment.wandb_run_name}

  ckpt:
    init_from: scratch
    path: ${experiment.wandb_run_name}

# ===== STAGE: PRETRAIN CONTROLLABLE ==========================================
pretrain_controllable:
  experiment:
    wandb_project: interdiff
    wandb_entity: latent-action-interdiff
    wandb_run_name: pretrain_controllable_vocab${tokenizer.vocab_size}_nlatent${model.num_latents}_seed${seed}

  model:
    _target_: interdiff.models.ControllableGPT
    n_layer: 4
    n_head: 4
    n_embd: 384
    dropout: 0.0
    context_length: ${context.seq_len}
    lm_head_out_size: ${tokenizer.vocab_size}
    vocab_size: ${tokenizer.vocab_size}
    bias: false
    pad_token_id: ${tokenizer.pad_token_id}
    bos_token_id: ${tokenizer.bos_token_id}
    eos_token_id: ${tokenizer.eos_token_id}
    latent_action_dim: 384
    num_latents: 128
    entropy_weight: 0.01
    vq_beta: 0.25

  training:
    _target_: interdiff.trainers.base.TrainConfig
    grad_clip: 1.0
    device: ${sys.device}
    mixed_dtype: ${sys.dtype}
    compile_model: ${sys.compile}
    always_save_checkpoint: ${sys.always_save_checkpoint}
    ckpt_path: ${ckpt.path}
    eval_interval: 200
    eval_iters: 5
    log_interval: 20
    max_iters: 20000
    warmup_iters: 1000
    batch_size: 512
    gradient_accumulation_steps: 1
    n_mols_generate: 500
    pad_token_id: ${tokenizer.pad_token_id}
    tokenizer_dir: ${tokenizer.output_dir}

  trainer:
    _target_: interdiff.trainers.ControllableGPTTrainer

  loader:
    _target_: interdiff.data.ControllableGPTLoader.ControllableGPTLoader
    batch_size: ${training.batch_size}
    seed: ${seed}
    val_ratio: 0.1

  log:
    name: ${experiment.wandb_run_name}

  ckpt:
    init_from: scratch
    path: ${experiment.wandb_run_name}

# ===== STAGE: POLICY DISTILLATION ============================================
policy_distillation:
  experiment:
    wandb_project: interdiff
    wandb_entity: latent-action-interdiff
    wandb_run_name: policydistillation_nlatents${model.lm_head_out_size}_vocab${tokenizer.vocab_size}_seed${seed}

  model:
    _target_: interdiff.models.PolicyNetwork
    n_layer: 4
    n_head: 4
    n_embd: 384
    dropout: 0.0
    context_length: ${context.seq_len}
    lm_head_out_size: 128    # must match num_latents of ControllableGPT
    vocab_size: ${tokenizer.vocab_size}
    bias: false
    pad_token_id: ${tokenizer.pad_token_id}
    bos_token_id: ${tokenizer.bos_token_id}
    eos_token_id: ${tokenizer.eos_token_id}

  training:
    _target_: interdiff.trainers.base.TrainConfig
    grad_clip: 1.0
    device: ${sys.device}
    mixed_dtype: ${sys.dtype}
    compile_model: ${sys.compile}
    always_save_checkpoint: ${sys.always_save_checkpoint}
    ckpt_path: ${ckpt.path}
    eval_interval: 200
    eval_iters: 5
    log_interval: 20
    max_iters: 100000
    warmup_iters: 1000
    batch_size: 1024
    gradient_accumulation_steps: 1
    n_mols_generate: 200
    pad_token_id: ${tokenizer.pad_token_id}
    tokenizer_dir: ${tokenizer.output_dir}

  trainer:
    _target_: interdiff.trainers.PretrainPolicyTrainer
    controllable_gpt_path: ${loader.controllable_gpt_path}

  loader:
    _target_: interdiff.data.PretrainPolicyLoader.PretrainPolicyLoader
    controllable_gpt_path: ???    # REQUIRED: override with --override loader.controllable_gpt_path=<path>
    action_dataset_out_dir: data/processed/${data.name}
    pad_token_id: ${tokenizer.pad_token_id}
    seed: ${seed}
    val_ratio: 0.1
    batch_size: ${training.batch_size}

  log:
    name: ${experiment.wandb_run_name}

  ckpt:
    init_from: scratch
    path: ${experiment.wandb_run_name}

# ===== STAGE: FINETUNE BASE ==================================================
finetune_base:
  experiment:
    wandb_project: interdiff
    wandb_entity: latent-action-interdiff
    wandb_run_name: ppo_${reward.task}_envs${ppo.num_envs}_steps${ppo.num_steps}_seed${seed}

  optim:
    beta1: 0.9
    beta2: 0.99

  ppo:
    _target_: interdiff.ppo.HParams
    num_actions: ${tokenizer.vocab_size}
    num_envs: 16
    num_steps: 256
    budget: 250000000
    num_epochs: 1
    num_minibatches: 8
    clip_eps: 0.2
    ent_coef: 0.01
    max_episode_length: ${context.seq_len}
    vf_coef: 0.5
    max_grad_norm: 1.0
    lr: 1e-6
    normalise_advantage: true
    clip_value_loss: true
    gae_lambda: 0.95
    discount: 1.0
    weight_decay: 0.01
    anneal_lr: true
    lambda_kld: 0.05
    log_frequency: 1
    log_to_wandb: ${wandb_log}
    wandb_project_name: interdiff
    save_dir: ${rl_train_cfg.ckpt_path}
    eval_frequency: 1
    random_start: false

  reward:
    task: qed    # Options: qed, logp, mw, tpsa, sa

  rl_train_cfg:
    _target_: interdiff.trainers.base_RL.RLTrainConfig
    device: ${sys.device}
    budget: ${ppo.budget}
    log_frequency: ${ppo.log_frequency}
    eval_frequency: ${ppo.eval_frequency}
    ckpt_path: ckpts/${experiment.wandb_run_name}
    always_save_checkpoint: false
    n_mols_generate: 100
    tokenizer_dir: ${tokenizer.output_dir}
    pad_token_id: ${tokenizer.pad_token_id}

  loader:
    _target_: interdiff.data.RLLoader.FinetuneBaseLoader

  log:
    name: ${experiment.wandb_run_name}

  ckpt:
    init_from: scratch
    path: ${experiment.wandb_run_name}

# ===== STAGE: FINETUNE CONTROLLABLE ==========================================
finetune_controllable:
  experiment:
    wandb_project: interdiff
    wandb_entity: latent-action-interdiff
    wandb_run_name: ppo_${reward.task}_envs${ppo.num_envs}_steps${ppo.num_steps}_seed${seed}

  optim:
    beta1: 0.9
    beta2: 0.99

  ppo:
    _target_: interdiff.ppo.HParams
    num_actions: ${tokenizer.vocab_size}
    num_envs: 16
    num_steps: 256
    budget: 250000000
    num_epochs: 1
    num_minibatches: 8
    clip_eps: 0.2
    ent_coef: 0.01
    max_episode_length: ${context.seq_len}
    vf_coef: 0.5
    max_grad_norm: 1.0
    lr: 1e-6
    normalise_advantage: true
    clip_value_loss: true
    gae_lambda: 0.95
    discount: 1.0
    weight_decay: 0.01
    anneal_lr: true
    lambda_kld: 0.05
    log_frequency: 1
    log_to_wandb: ${wandb_log}
    wandb_project_name: interdiff
    save_dir: ${rl_train_cfg.ckpt_path}
    eval_frequency: 1
    random_start: false

  reward:
    task: qed    # Options: qed, logp, mw, tpsa, sa

  rl_train_cfg:
    _target_: interdiff.trainers.base_RL.RLTrainConfig
    device: ${sys.device}
    budget: ${ppo.budget}
    log_frequency: ${ppo.log_frequency}
    eval_frequency: ${ppo.eval_frequency}
    ckpt_path: ckpts/${experiment.wandb_run_name}
    always_save_checkpoint: false
    n_mols_generate: 100
    tokenizer_dir: ${tokenizer.output_dir}
    pad_token_id: ${tokenizer.pad_token_id}

  loader:
    _target_: interdiff.data.RLLoader.FinetuneControlable
    ckpt_controllable_path: ???    # REQUIRED: override with --override loader.ckpt_controllable_path=<path>
    ckpt_name: ???                 # REQUIRED: override with --override loader.ckpt_name=best.pt

  log:
    name: ${experiment.wandb_run_name}

  ckpt:
    init_from: scratch
    path: ${experiment.wandb_run_name}
