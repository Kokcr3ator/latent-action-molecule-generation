# =============================================================================
# Evaluate — generate molecules from a checkpoint and report VUN metrics
# =============================================================================

# ===== EXPERIMENT =====
experiment:
  wandb_project: interdiff
  wandb_entity: latent-action-interdiff
  wandb_run_name: eval_${model.type}_vocab${tokenizer.vocab_size}_temp${generation.temperature}_seed${seed}

seed: 42
wandb_log: true

# ===== CONTEXT =====
context:
  seq_len: 128

# ===== TOKENIZER =====
tokenizer:
  dataset_path: ${data.smiles}
  output_dir: interdiff/data/processed/${data.name}_tok_seqlen_${context.seq_len}_vocabsize_${tokenizer.vocab_size}
  use_selfies: false
  vocab_size: 500
  pad_token: "[PAD]"
  unk_token: "[UNK]"
  mask_token: "[MASK]"
  bos_token: "[BOS]"
  eos_token: "[EOS]"
  seq_length: ${context.seq_len}
  pad_token_id: 0
  unk_token_id: 1
  mask_token_id: 2
  bos_token_id: 3
  eos_token_id: 4

# ===== DATA =====
data:
  name: zinc
  smiles: interdiff/data/zinc/zinc.txt
  pad_token_id: ${tokenizer.pad_token_id}

# ===== MODEL =====
model:
  type: base   # base | controllable

# ===== GENERATION =====
generation:
  n_mols: 10000
  temperature: 1.0
  top_k: null

# ===== LOADER =====
loader:
  ckpt_path: null
  ckpt_name: best.pt

# ===== LOGGING =====
log:
  _target_: interdiff.logging.wandb_logger.WandbLogger
  project: ${experiment.wandb_project}
  entity: ${experiment.wandb_entity}
  name: ${experiment.wandb_run_name}
  group: eval
