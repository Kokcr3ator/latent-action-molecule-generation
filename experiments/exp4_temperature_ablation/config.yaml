# =============================================================================
# Experiment 4 — Temperature ablation
# Properties listed here override the defaults in configs/*.yaml.
# Everything else is inherited from the base configs unchanged.
#
# Requires pretrained checkpoints from exp1 (stages 1 and 2).
# =============================================================================

# --- Paths -------------------------------------------------------------------
data_dir: interdiff/data/zinc/zinc.txt   # raw SMILES file
ckpt_root: ckpts                         # root directory for all checkpoints

# --- Model -------------------------------------------------------------------
vocab_size: 500     # base GPT vocab size (must match exp1)
num_latents: 128    # ControllableGPT codebook size (must match exp1)

# --- Evaluation --------------------------------------------------------------
seeds: [0, 1, 2, 3, 4]
temperatures: [0.5, 0.8, 1.0, 1.2, 1.5, 2.0]
n_mols: 10000       # molecules to sample per temperature per model per seed

# --- Logging -----------------------------------------------------------------
wandb_project: interdiff
wandb_entity: latent-action-interdiff
wandb_log: true
wandb_group: exp4_temperature_ablation
