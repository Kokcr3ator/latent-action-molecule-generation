# =============================================================================
# Experiment 3 — LAM scaling: how does ControllableGPT scale with codebook size?
# Properties listed here override the defaults in configs/*.yaml.
# Everything else is inherited from the base configs unchanged.
# =============================================================================

# --- Paths -------------------------------------------------------------------
data_dir: interdiff/data/zinc/zinc.txt   # raw SMILES file
ckpt_root: /scratch/uceeepi/interdiff/ckpts

# --- Model -------------------------------------------------------------------
vocab_size: 2048                          # tokeniser vocab size (fixed)
num_latents_list: [8, 32, 128, 512, 1024, 2048, 4096] # codebook sizes to sweep

# --- Training ----------------------------------------------------------------
use_distillation: false        # set true to run policy distillation before RL
batch_size: 2048
seeds: [0, 1, 2]
tasks: [qed, logp, sa, mw, tpsa]
controllable_iters: 20_000   # max_iters for ControllableGPT pretraining
distillation_iters: 20_000   # max_iters for policy distillation
rl_budget: 250_000_000        # total env steps for PPO finetuning

# --- Logging -----------------------------------------------------------------
wandb_project: interdiff
wandb_entity: latent-action-interdiff
wandb_group: exp3_lam_scaling
wandb_dir: /scratch/uceeepi/interdiff/wandb
